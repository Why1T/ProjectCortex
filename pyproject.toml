[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex"
version = "0.1.0"
description = "Cortex - Alpaca-backed swing trading research and advisory bot (paper only, never places live trades)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "yfinance>=0.2.60",
    "streamlit>=1.40",
]

[project.scripts]
cortex = "cortex.main:main"
cortex-web = "cortex.web_app:launch"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["cortex*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
